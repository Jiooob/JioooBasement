<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="blog-title" content="RSS配置试验件">
    <meta name="blog-date" content="2026-08-14">
    <meta name="blog-summary" content="这是文章文件里的原始摘要；RSS 会使用统一配置中的覆盖摘要。">
</head>
<body>
    <h2>建筑垃圾入场记录</h2>

    <p>
        今天在基地的底部里捡到一枚松动的螺丝、一根两端什么都没有连接着的网线，
        以及空纸箱。它们互相之间没有关系，所以很适合被放在这里。
    </p>

    <p>
        这篇文章也是一件 RSS 试验品：页面卡片读取文章自己的标题、日期与摘要，
        RSS 阅读器则读取 <code>data/rss.json</code> 中为它准备的完整覆盖配置。
    </p>

    <h2>试验结论</h2>

    <ul>
        <li>没有爆炸。</li>
        <li>没有产生有用的建筑材料。</li>
    </ul>
</body>
</html>
