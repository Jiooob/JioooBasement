<p>
    高二时候有一段时间痴迷于场景画，以至于每日研究神秘透视，晚自习把题目放在一边就开始瞎画。
    非科班出身也不怎么会想着打草稿，一支铅笔和墨水笔顺着想法想到什么画什么，记得大概一个多小时慢慢磨也就能涂完，
    完工后就塞到活页本里。
  </p>
<p>
    今日在房间书箱中偶然翻阅到了画集的一部分，一叠纸左侧最上方的孔洞别着回形针，原来我那是这么有序的么。
  </p>
